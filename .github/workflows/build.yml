name: Build and Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'Database/**'
      - '.github/**'
      - 'readme.md'
      - 'README.md'
      - '.gitignore'
      - '.gitattributes'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore Ipdb.Models/Ipdb.Models.csproj

      - name: Build and Pack
        run: dotnet pack Ipdb.Models/Ipdb.Models.csproj --configuration Release --no-restore --output nupkgs /p:Version=1.1.${{ github.run_number }}

      - name: Publish to NuGet
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path "nupkgs" -Filter "*.nupkg" | Select-Object -First 1
          if ($nupkg) {
            dotnet nuget push $nupkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          } else {
            Write-Error "No .nupkg file found in nupkgs directory"
            exit 1
          }
